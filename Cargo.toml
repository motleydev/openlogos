# OpenLogos Rust workspace. Every crate under crates/ is a member; specs/06-nix-operations.md
# names each crate's responsibility and docs/adr/0001-rust-core-native-ui.md explains why
# one Rust core serves every platform. `just` lists the build and test workflows.

[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# Matches the toolchain pinned in flake.nix; bump both together.
rust-version = "1.99"
repository = "https://github.com/motleydev/openlogos"
publish = false

[workspace.dependencies]
openlogos-core = { path = "crates/core" }
openlogos-text = { path = "crates/text" }
openlogos-search = { path = "crates/search" }
openlogos-retrieval = { path = "crates/retrieval" }
openlogos-package = { path = "crates/package" }
openlogos-collections = { path = "crates/collections" }
openlogos-workspaces = { path = "crates/workspaces" }
openlogos-ink = { path = "crates/ink" }
openlogos-notes = { path = "crates/notes" }
openlogos-sync = { path = "crates/sync" }
openlogos-conformance = { path = "crates/conformance" }
openlogos-retrieval-sqlite = { path = "crates/retrieval-sqlite" }

# Third-party crates, pinned exactly so every platform's binding is generated from the same
# code; `cargo update` is a reviewed change. Each one must build for wasm32-unknown-unknown.
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
unicode-segmentation = "=1.13.3"
# Embedded retrieval engine (crates/retrieval-sqlite, ADR 0002, measured in B064). SQLite is
# compiled from the amalgamation that libsqlite3-sys bundles (FTS5 on); sqlite-vec is the
# vector extension's C source compiled and linked statically; roaring is the posting-list
# format of the token engine; unicode-normalization feeds the shared Greek/Hebrew tokenizer.
rusqlite = { version = "=0.41.0", features = ["bundled"] }
libsqlite3-sys = { version = "=0.39.1", features = ["bundled"] }
sqlite-vec = "=0.1.9"
roaring = "=0.11.5"
unicode-normalization = "=0.1.26"
# SHA-256 of pack files for the device catalog and the link index rebuild check (B068).
sha2 = "=0.10.9"
# Native bindings only (crates/ffi, non-wasm targets); the uniffi-bindgen binary must be
# built from this same version so the generated Swift and Kotlin match the scaffolding.
uniffi = "=0.32.2"

# Shared lint policy; each crate opts in with `[lints] workspace = true`. Clippy itself
# runs with `-D warnings` (justfile, nix flake check), so a warning here fails CI.
[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "warn"

[workspace.lints.clippy]
all = "warn"

# Size first: the core ships inside mobile apps and as WebAssembly, and specs/01 sets
# binary budgets. `panic` stays at the default "unwind" because UniFFI (B061) turns
# panics into errors at the binding boundary, which an aborting panic cannot do.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true

# sqlite-vec's distance loops are the whole cost of brute-force vector search (benchmark
# R5). At opt-level "z" the int8 kernels run about 20× slower than at -O3 while the object
# is a few KB either way (docs/evidence/B064.md), so this one C package is built for speed.
# .cargo/config.toml adds its NEON kernels on the arm64 targets.
[profile.release.package.sqlite-vec]
opt-level = 3
