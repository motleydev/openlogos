# XcodeGen spec for the OpenLogos app shell (B063). `xcodegen generate` in this directory
# (scripts/sim.sh and scripts/ship.sh do it) writes OpenLogos.xcodeproj and Generated/, both
# gitignored; this file is the project. The real reader is B062's; this shell only proves the
# lane: SwiftUI app, the Rust core through the UniFFI bindings, simulator and signed builds.
#
# The core comes in exactly as scripts/apple-bindings.sh leaves it under artifacts/apple/ (one
# copy, gitignored): the XCFramework with the three static slices and the generated Swift
# file. Run `just bindings-swift` before generating the project.
#
# B005 adds the test bundles: OpenLogosTests / OpenLogosMacTests host Tests/ReaderTests in the
# app (the TextKit 2 round trips through the real text view) and OpenLogosUITests runs
# Tests/UITests (accessibility audit, element labels) against the iPad simulator app.
name: OpenLogos
options:
  bundleIdPrefix: org.openlogos
  xcodeVersion: "26.6"
  createIntermediateGroups: true
  generateEmptyDirectories: false
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.10"
    CODE_SIGN_STYLE: Automatic
    # scripts/ship.sh passes DEVELOPMENT_TEAM from .envrc.local; simulator builds need none.
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: true
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: false
targets:
  OpenLogos:
    type: application
    platform: iOS
    supportedDestinations: [iOS, iPadOS]
    sources:
      - path: Sources
      - path: ../../../artifacts/apple/generated/OpenLogosCore.swift
        group: Generated bindings
    dependencies:
      - framework: ../../../artifacts/apple/OpenLogosCoreFFI.xcframework
        embed: false
    info:
      path: Generated/OpenLogos-Info.plist
      properties:
        CFBundleDisplayName: OpenLogos
        CFBundleName: OpenLogos
        # XcodeGen would otherwise write a literal 1.0; the shelf shows these two.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: false
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.openlogos.app
        PRODUCT_NAME: OpenLogos
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
  OpenLogosTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/ReaderTests
    dependencies:
      - target: OpenLogos
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.openlogos.app.tests
        GENERATE_INFOPLIST_FILE: true
  OpenLogosUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/UITests
    dependencies:
      - target: OpenLogos
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.openlogos.app.uitests
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: OpenLogos
  OpenLogosMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/ReaderTests
    dependencies:
      - target: OpenLogosMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.openlogos.app.mactests
        GENERATE_INFOPLIST_FILE: true
        CODE_SIGN_IDENTITY: "-"
        # The host target is OpenLogosMac but its product is OpenLogos.app.
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/OpenLogos.app/Contents/MacOS/OpenLogos
        BUNDLE_LOADER: $(TEST_HOST)
  OpenLogosMac:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: ../../../artifacts/apple/generated/OpenLogosCore.swift
        group: Generated bindings
    dependencies:
      - framework: ../../../artifacts/apple/OpenLogosCoreFFI.xcframework
        embed: false
    info:
      path: Generated/OpenLogosMac-Info.plist
      properties:
        CFBundleDisplayName: OpenLogos
        CFBundleName: OpenLogos
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.reference
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.openlogos.app
        PRODUCT_NAME: OpenLogos
        # A local run needs no identity; the release lane is iOS-only for now.
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: false
schemes:
  OpenLogos:
    build:
      targets:
        OpenLogos: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - OpenLogosTests
        - OpenLogosUITests
    archive:
      config: Release
  OpenLogosMac:
    build:
      targets:
        OpenLogosMac: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - OpenLogosMacTests
