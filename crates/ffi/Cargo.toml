[package]
name = "openlogos-ffi"
description = "UniFFI and wasm-bindgen surfaces over the core, versioned API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
# cdylib: the Kotlin host loads it through JNA, uniffi-bindgen reads its metadata and
# wasm-pack emits the wasm module from it. staticlib: linked into the Apple XCFramework.
# rlib: the workspace's own tests.
crate-type = ["cdylib", "staticlib", "rlib"]

[[bin]]
# `cargo run -p openlogos-ffi --features bindgen --bin uniffi-bindgen -- generate ...`
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
# Pulls uniffi's command-line generator into the binary above; off for every library build.
bindgen = ["uniffi/cli"]
# Links the embedded retrieval engine (ADR 0002) and exports `retrieval_smoke`; off by
# default until the search crate's query API exists. B064 measures the size it adds (R3).
retrieval = ["dep:openlogos-retrieval", "dep:openlogos-retrieval-sqlite"]

[dependencies]
openlogos-core = { workspace = true }
openlogos-text = { workspace = true }
openlogos-conformance = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

# UniFFI serves Apple and Android only (src/native.rs); the wasm32 build must not see it.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
uniffi = { workspace = true }
openlogos-retrieval = { workspace = true, optional = true }
openlogos-retrieval-sqlite = { workspace = true, optional = true }

# The web surface (src/wasm.rs). `wasm-bindgen` must be the exact version of the
# `wasm-bindgen-cli` that flake.nix provides (`wasm-bindgen --version`); js-sys and
# wasm-bindgen-test are the releases cut alongside it.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.121"
js-sys = "=0.3.98"
serde-wasm-bindgen = "=0.6.5"
# The `retrieval` feature on the web: SQLite inside the module through sqlite-wasm-rs (B064).
openlogos-retrieval = { workspace = true, optional = true }
openlogos-retrieval-sqlite = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
serde_json = { workspace = true }
wasm-bindgen-test = "=0.3.71"

[lints]
workspace = true

# `scripts/wasm-bindings.sh` runs the pinned wasm-opt from the Nix shell itself and
# records sizes before and after; wasm-pack must not download its own binaryen.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
