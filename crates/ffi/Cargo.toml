[package]
name = "openlogos-ffi"
description = "UniFFI and wasm-bindgen surfaces over the core, versioned API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
# cdylib: the Kotlin host loads it through JNA and uniffi-bindgen reads its metadata.
# staticlib: linked into the Apple XCFramework. rlib: the workspace's own tests.
crate-type = ["cdylib", "staticlib", "rlib"]

[[bin]]
# `cargo run -p openlogos-ffi --features bindgen --bin uniffi-bindgen -- generate ...`
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
# Pulls uniffi's command-line generator into the binary above; off for every library build.
bindgen = ["uniffi/cli"]

[dependencies]
openlogos-core = { workspace = true }
openlogos-text = { workspace = true }
openlogos-conformance = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

# UniFFI serves Apple and Android only; the wasm32 build (B064) must not see it.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
uniffi = { workspace = true }

[lints]
workspace = true
